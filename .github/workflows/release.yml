name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already has the Android SDK. setup-android@v3 still
      # asks sdkmanager for the removed "tools" package and fails the job.
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          GENERIC_KEYSTORE_BASE64: ${{ secrets.GENERIC_KEYSTORE_BASE64 }}
          GENERIC_STORE_PASSWORD: ${{ secrets.GENERIC_STORE_PASSWORD }}
          GENERIC_KEY_ALIAS: ${{ secrets.GENERIC_KEY_ALIAS }}
          GENERIC_KEY_PASSWORD: ${{ secrets.GENERIC_KEY_PASSWORD }}
          SOLANA_MOBILE_KEYSTORE_BASE64: ${{ secrets.SOLANA_MOBILE_KEYSTORE_BASE64 }}
          SOLANA_MOBILE_STORE_PASSWORD: ${{ secrets.SOLANA_MOBILE_STORE_PASSWORD }}
          SOLANA_MOBILE_KEY_ALIAS: ${{ secrets.SOLANA_MOBILE_KEY_ALIAS }}
          SOLANA_MOBILE_KEY_PASSWORD: ${{ secrets.SOLANA_MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            GENERIC_KEYSTORE_BASE64 GENERIC_STORE_PASSWORD GENERIC_KEY_ALIAS GENERIC_KEY_PASSWORD \
            SOLANA_MOBILE_KEYSTORE_BASE64 SOLANA_MOBILE_STORE_PASSWORD SOLANA_MOBILE_KEY_ALIAS SOLANA_MOBILE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode release keystores
        env:
          GENERIC_KEYSTORE_BASE64: ${{ secrets.GENERIC_KEYSTORE_BASE64 }}
          SOLANA_MOBILE_KEYSTORE_BASE64: ${{ secrets.SOLANA_MOBILE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          printf '%s' "$GENERIC_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > signing/sotreus-generic.jks
          printf '%s' "$SOLANA_MOBILE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > signing/sotreus-solana-mobile.jks
          test -s signing/sotreus-generic.jks
          test -s signing/sotreus-solana-mobile.jks

      - name: Build release APKs and the Play App Bundle
        env:
          SOTREUS_GENERIC_STORE_FILE: signing/sotreus-generic.jks
          SOTREUS_GENERIC_STORE_PASSWORD: ${{ secrets.GENERIC_STORE_PASSWORD }}
          SOTREUS_GENERIC_KEY_ALIAS: ${{ secrets.GENERIC_KEY_ALIAS }}
          SOTREUS_GENERIC_KEY_PASSWORD: ${{ secrets.GENERIC_KEY_PASSWORD }}
          SOTREUS_SOLANA_MOBILE_STORE_FILE: signing/sotreus-solana-mobile.jks
          SOTREUS_SOLANA_MOBILE_STORE_PASSWORD: ${{ secrets.SOLANA_MOBILE_STORE_PASSWORD }}
          SOTREUS_SOLANA_MOBILE_KEY_ALIAS: ${{ secrets.SOLANA_MOBILE_KEY_ALIAS }}
          SOTREUS_SOLANA_MOBILE_KEY_PASSWORD: ${{ secrets.SOLANA_MOBILE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGenericRelease :app:assembleSolanaMobileRelease :app:bundleGenericRelease

      - name: Verify the two APKs use different certificates
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bt=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          fingerprint() {
            "$bt/apksigner" verify --print-certs "$1" | awk -F': ' '/certificate SHA-256 digest/ { print $2; exit }'
          }
          generic=$(fingerprint app/build/outputs/apk/generic/release/app-generic-release.apk)
          solana=$(fingerprint app/build/outputs/apk/solanaMobile/release/app-solanaMobile-release.apk)
          if [ -z "$generic" ] || [ -z "$solana" ]; then
            echo "Could not read a certificate from one of the APKs."
            exit 1
          fi
          if [ "$generic" = "$solana" ]; then
            echo "Both release APKs are signed with the same certificate."
            exit 1
          fi
          echo "generic $generic"
          echo "solanaMobile $solana"

      - name: Collect release files
        id: files
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/generic/release/output-metadata.json"))["elements"][0]["versionName"])')
          mkdir -p dist
          cp app/build/outputs/apk/generic/release/app-generic-release.apk "dist/Sotreus-${version}-generic.apk"
          cp app/build/outputs/apk/solanaMobile/release/app-solanaMobile-release.apk "dist/Sotreus-${version}-solana-mobile.apk"
          cp app/build/outputs/bundle/genericRelease/app-generic-release.aab "dist/Sotreus-${version}-generic.aab"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="ci-${GITHUB_SHA::7}"
          fi
          cat > dist/notes.md <<EOF
          Sotreus ${version}

          - \`Sotreus-${version}-generic.apk\` — sideload on a normal Android phone. Signed with the Play upload key. An install from Google Play will not update from this file.
          - \`Sotreus-${version}-solana-mobile.apk\` — Solana Mobile phones, and the file to submit to the dApp Store.
          - \`Sotreus-${version}-generic.aab\` — upload to the Play Console.

          Both APKs use \`com.sotreus.app\` with different certificates. Install one.
          EOF
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.files.outputs.tag }}
          name: ${{ steps.files.outputs.tag }}
          body_path: dist/notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ github.event_name == 'push' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
